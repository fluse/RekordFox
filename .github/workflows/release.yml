name: Build and Release RekordFox

# Der Workflow startet automatisch, wenn du einen neuen Tag pushst (z.B. v1.0.0)
on:
  push:
    tags:
      - 'v*'

# Notwendig, damit der Workflow Schreibrechte hat, um das Release auf GitHub anzulegen
permissions:
  contents: write

jobs:
  release:
    # Hier definieren wir eine Matrix, um die App für alle drei Betriebssysteme parallel zu bauen
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      # ---> DIESER SCHRITT WAR FEHLEND <---
      - name: Build Application
        run: npm run build
        # Falls dein Build-Befehl in der package.json anders heißt (z.B. npm run build:electron),
        # musst du das hier entsprechend anpassen.

      # electron-builders eigener CSC_LINK/CSC_KEY_PASSWORD-Mechanismus importiert das
      # Zertifikat zwar in eine temporäre Keychain, markiert es dabei aber nicht als
      # vertrauenswürdig — für ein selbst-signiertes (nicht von Apple ausgestelltes)
      # Zertifikat findet codesign es dann trotzdem nicht ("no identity found").
      # Deshalb übernehmen wir Import + Trust hier selbst.
      - name: Import & trust code signing certificate (macOS)
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/rekordfox-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/rekordfox-cert.p12"

          echo "$CSC_LINK" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Der eigentlich fehlende Schritt: ohne "trusted" findet codesign die Identität nicht.
          # add-trusted-cert braucht ein reines Zertifikat (DER/PEM), keine PKCS#12-Bundle,
          # daher hier erst das Zertifikat aus der .p12 extrahieren.
          CERT_PEM="$RUNNER_TEMP/rekordfox-cert.pem"
          openssl pkcs12 -legacy -in "$CERT_PATH" -clcerts -nokeys -passin "pass:$CSC_KEY_PASSWORD" -out "$CERT_PEM"
          security add-trusted-cert -r trustRoot -p codeSign -k "$KEYCHAIN_PATH" "$CERT_PEM"

          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/[\" ]//g')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          rm "$CERT_PATH" "$CERT_PEM"

      - name: Build & Publish to GitHub Releases
        env:
          # Der Token wird von GitHub automatisch bereitgestellt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Muss exakt dem "CN" (Common Name) entsprechen, mit dem das Zertifikat
          # erstellt wurde — steuert unseren afterPack-Hook (build/afterPack.js),
          # der die App damit nachsigniert.
          CSC_NAME: RekordFox Code Signing
        # Dieser Befehl baut die App und lädt sie direkt ins GitHub Release hoch
        run: npx electron-builder --publish always
